<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Brain League | Reasoning Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0B0D;
  --surface: #17191D;
  --surface-raised: #1D2025;
  --ink: #FFFFFF;
  --muted: #A7A9AE;
  --line: #303238;
  --accent: #FF5F1F;
  --accent-ink: #111111;
  --track: #303238;
  --ok: #65D69A;
  --bad: #FF8178;
  --warn: #FFB15C;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(ellipse at 50% -18%, rgba(255,95,31,.13), transparent 48%), var(--bg);
  color: var(--ink); font: 400 16px/1.6 "Inter", system-ui, sans-serif; letter-spacing: -.01em;
}
body:before {
  content: ""; position: fixed; inset: 0 0 auto; height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
  z-index: 10; pointer-events: none;
}
main { width: min(100%, 1120px); margin: 0 auto; padding: 38px 22px 64px; }
h1, h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  letter-spacing: -.045em; line-height: 1.12; margin: 0;
}
h1 { font-size: clamp(2rem, 5vw, 2.8rem); max-width: 17ch; }
h1:after {
  content: ""; display: block; width: 48px; height: 4px; margin-top: 16px;
  border-radius: 4px; background: var(--accent);
}
h2 { font-size: 1.35rem; letter-spacing: -.03em; }
p { margin: 0 0 14px; }
.muted, .legend { color: var(--muted); }
.legend { font-size: .84rem; line-height: 1.55; }
.card {
  position: relative;
  background: linear-gradient(145deg, rgba(255,255,255,.025), transparent 48%), var(--surface);
  border: 1px solid var(--line); border-radius: 18px;
  padding: clamp(20px, 4vw, 28px); box-shadow: 0 16px 44px rgba(0,0,0,.18);
}
.stack > * + * { margin-top: 20px; }
label.f { display: block; font-weight: 600; margin-bottom: 8px; color: #F1F1F2; }
input[type=text] {
  width: 100%; padding: 14px 15px; font: inherit; color: var(--ink);
  background: #101114; border: 1px solid var(--line); border-radius: 10px;
  transition: border-color .18s, box-shadow .18s;
}
input[type=text]::placeholder { color: #777B82; }
input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,95,31,.14); }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn {
  background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
  border-radius: 10px; padding: 13px 21px; font-weight: 700; letter-spacing: -.015em;
  box-shadow: 0 5px 18px rgba(255,95,31,.16);
  transition: transform .16s, filter .16s, box-shadow .16s;
}
.btn:hover:not([disabled]) { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,95,31,.22); }
.btn:active:not([disabled]) { transform: translateY(0); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #45484F; box-shadow: none; }
.btn.ghost:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); background: rgba(255,95,31,.06); }
.btn[disabled] { opacity: .35; cursor: not-allowed; box-shadow: none; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.row > strong { font-family: "Space Grotesk", sans-serif; font-size: .96rem; }
.timer {
  font: 700 1.1rem "Space Mono", monospace; font-variant-numeric: tabular-nums;
  color: var(--accent); background: rgba(255,95,31,.09);
  border: 1px solid rgba(255,95,31,.28); padding: 8px 12px; border-radius: 9px;
}
.timer.low { color: var(--warn); background: rgba(255,177,92,.08); border-color: rgba(255,177,92,.3); }
.sec { font: 700 .78rem "Space Grotesk", sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.qt { font: 600 clamp(1.1rem, 2.5vw, 1.3rem)/1.5 "Space Grotesk", sans-serif; letter-spacing: -.025em; margin-bottom: 20px; white-space: pre-line; }
.opts { display: grid; gap: 11px; }
.opts button {
  text-align: left; min-height: 52px; padding: 13px 15px; background: #101114; color: var(--ink);
  border: 1px solid #363940; border-radius: 11px; display: flex; gap: 13px; align-items: center;
  transition: background .16s, border-color .16s, transform .16s;
}
.opts button:hover { border-color: #777B82; background: #1C1E23; transform: translateY(-1px); }
.opts button b { min-width: 1.35em; color: var(--accent); font: 700 .9rem "Space Mono", monospace; }
.opts button[aria-pressed=true] { background: rgba(255,95,31,.13); color: #fff; border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.opts button[aria-pressed=true] b { color: var(--accent); }
.fig { margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 9px; }
.fig.m { display: grid; grid-template-columns: repeat(3, minmax(64px, 84px)); justify-content: center; gap: 9px; }
.fc {
  width: 58px; height: 58px; border: 1px solid var(--line); border-radius: 10px;
  background: #101114; color: #F3F3F4; display: flex; align-items: center; justify-content: center;
}
.fig.m .fc { width: 100%; height: auto; aspect-ratio: 1; }
.fc svg { width: 100%; height: 100%; }
.fc.q { border-style: dashed; border-color: var(--accent); font: 700 1.6rem "Space Grotesk", sans-serif; color: var(--accent); background: rgba(255,95,31,.06); }
.lt { position: absolute; left: 5px; top: 3px; font: 700 .68rem "Space Mono", monospace; color: var(--muted); }
.opts.v { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.v button { flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 112px; padding: 10px; }
.opts.v svg { width: min(100%, 76px); height: 72px; }
.nav { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; }
.nav button {
  min-height: 37px; padding: 6px 0; font: 600 .78rem "Space Mono", monospace;
  background: #111216; color: var(--muted); border: 1px solid #35383E; border-radius: 8px;
  transition: border-color .15s, background .15s, color .15s;
}
.nav button:hover { border-color: #777B82; color: var(--ink); }
.nav button.a { background: #292C32; color: #fff; border-color: #454950; }
.nav button.c { background: rgba(255,95,31,.12); border: 1.5px solid var(--accent); color: var(--accent); }
.big { font: 700 clamp(3.2rem, 10vw, 4.4rem)/1 "Space Grotesk", sans-serif; letter-spacing: -.07em; color: var(--accent); }
.bar { height: 9px; background: #303238; border-radius: 99px; margin: 10px 0 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #FF7A45, var(--accent)); border-radius: 99px; box-shadow: 0 0 14px rgba(255,95,31,.28); }
.sr { padding: 14px 0; border-top: 1px solid var(--line); }
.sr:first-of-type { border-top: 0; }
.rv { padding: 17px 0; border-top: 1px solid var(--line); }
.rv .ok { color: var(--ok); font-weight: 700; }
.rv .bad { color: var(--bad); font-weight: 700; }
.rv p { margin: 0 0 7px; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.2em; }
@media (max-width: 520px) {
  main { padding: 30px 15px 44px; }
  .card { border-radius: 15px; padding: 19px; }
  .nav { gap: 5px; }
  .nav button { min-height: 35px; font-size: .72rem; }
  .opts.v { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row .btn { padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after { scroll-behavior: auto !important; transition: none !important; }
}
@media print {
  :root { color-scheme: light; --bg: #fff; --surface: #fff; --ink: #111; --muted: #555; --line: #ddd; --track: #ddd; --accent: #D94712; }
  body { background: #fff; color: #000; }
  body:before { display: none; }
  .no-print { display: none !important; }
  .card { background: #fff; color: #111; border: 0; box-shadow: none; padding: 0; }
  .rv { break-inside: avoid; }
  .fc, .opts button { background: #fff; color: #111; border-color: #bbb; }
  .muted, .legend { color: #555; }
}

/* Enjoyable intro and in-test companion panel */
.eyebrow { color: var(--accent); font: 700 .76rem "Space Mono", monospace; letter-spacing: .13em; text-transform: uppercase; }
.intro-hero { position: relative; overflow: hidden; padding: clamp(26px,5vw,54px); border: 1px solid #3b302d; border-radius: 22px; background: radial-gradient(circle at 88% 12%,rgba(255,95,31,.2),transparent 32%),linear-gradient(135deg,#1b1d21,#111214 72%); }
.intro-hero:after { content: "✦"; position: absolute; right: 7%; top: 8%; font-size: clamp(5rem,15vw,10rem); color: rgba(255,95,31,.12); transform: rotate(12deg); pointer-events:none; }
.intro-hero h1 { max-width: 13ch; font-size: clamp(2.5rem,7vw,4.6rem); margin: 12px 0 18px; }
.intro-hero h1:after { display:none; }
.intro-copy { max-width: 62ch; color: #c6c8cc; font-size: 1.06rem; }
.intro-tags { display:flex; flex-wrap:wrap; gap:9px; margin:22px 0 26px; }
.intro-tags span { border:1px solid #3a3d43; background:#111317; color:#ddd; border-radius:99px; padding:7px 12px; font-size:.82rem; }
.intro-bottom { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,.72fr); gap:18px; align-items:stretch; }
.intro-note { background:#17191d; border:1px solid var(--line); border-radius:16px; padding:20px; }
.intro-note strong { color:var(--accent); display:block; margin-bottom:7px; }
.intro-note p:last-child { margin-bottom:0; }
.name-wrap { max-width:420px; margin-top:20px; }
.test-layout { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; align-items:start; }
.test-main { min-width:0; }
.test-side { position:sticky; top:18px; display:grid; gap:14px; }
.progress-card,.quote-card,.stats-card { background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:16px 18px; }
.progress-head { display:flex; justify-content:space-between; gap:12px; align-items:center; font-size:.86rem; color:var(--muted); }
.progress-head strong { color:var(--ink); font-family:"Space Grotesk",sans-serif; }
.progress-track { height:9px; border-radius:99px; background:#303238; overflow:hidden; margin-top:11px; }
.progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#ff8a50,var(--accent)); box-shadow:0 0 15px rgba(255,95,31,.3); transition:width .25s ease; }
.quote-card { background:linear-gradient(145deg,rgba(255,95,31,.11),transparent 70%),var(--surface); min-height:170px; }
.quote-mark { font:700 2.5rem/1 Georgia,serif; color:var(--accent); }
.quote-text { font:600 1.08rem/1.45 "Space Grotesk",sans-serif; margin:9px 0 12px; }
.quote-by { color:var(--muted); font-size:.78rem; }
.stats-card { display:flex; justify-content:space-between; gap:10px; }
.stat strong { display:block; font:700 1.35rem "Space Grotesk",sans-serif; color:var(--accent); }
.stat span { color:var(--muted); font-size:.75rem; }
@media(max-width:820px) {
  .test-layout { grid-template-columns:1fr; }
  .test-side { position:static; grid-template-columns:1fr 1fr; }
  .stats-card { grid-column:1/-1; }
}
@media(max-width:560px) {
  .intro-bottom,.test-side { grid-template-columns:1fr; }
  .intro-hero { padding:25px 20px; }
  .intro-hero h1 { font-size:2.65rem; }
  .stats-card { grid-column:auto; }
}


.league-link { display:inline-flex; align-items:center; gap:8px; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:9px 14px; text-decoration:none; font-weight:700; }
.league-link:hover { border-color:var(--accent); color:var(--accent); }
.result-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.rank-card { display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); }
.rank-card:last-child { border-bottom:0; }
.rank-no { font:700 1.2rem "Space Grotesk",sans-serif; color:var(--accent); }
.rank-name { font-weight:700; }
.rank-meta { color:var(--muted); font-size:.82rem; }
.rank-score { text-align:right; font:700 1.2rem "Space Grotesk",sans-serif; }
.pill { display:inline-block; padding:4px 9px; border:1px solid var(--line); border-radius:99px; color:var(--muted); font-size:.76rem; }
.notice { border:1px solid rgba(255,95,31,.35); background:rgba(255,95,31,.08); border-radius:12px; padding:13px 15px; color:#f0d4c8; }
.review-hidden { display:none; }

</style>

  params.callback=cb;

  script.src=API_URL+"?"+Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");

  [1,2,3].forEach(function(k){var a=dd[k];dh+='<div class="sr"><div class="row"><strong>'+["Easier","Medium","Harder"][k-1]+'</strong><span>'+a[0]+' / '+a[1]+'</span></div><div class="bar"><i style="width:'+(a[0]/a[1]*100)+'%"></i></div></div>'});
  lastResult={score:tot,percentage:pct,by:by,seconds:usedSec};
  var payload={action:"submit",submissionId:currentAttemptId,playerId:PLAYER.id,nickname:who,score:tot,total:Q.length,percentage:pct,seconds:usedSec,completedAt:new Date().toISOString(),categories:by};
  var submitStatus="Sending your result to the Brain League…";
  app.innerHTML='<div class="stack"><div class="eyebrow">Challenge complete</div><h1>That’s a wrap, '+esc(who)+'! 🎉</h1><p class="muted">'+today()+' · Time used '+fmt(usedSec)+' of '+fmt(LIMIT)+'</p>'+
  '<div class="card"><div class="big">'+tot+' <span class="muted" style="font-size:1.3rem">/ '+Q.length+'</span></div><p style="margin:8px 0 0">'+pct+'% correct. Overall band: <strong>'+lvl+'</strong>.</p><span class="pill">Attempt being recorded</span></div>'+
  '<div class="card"><h2 style="margin-bottom:8px">Your reasoning breakdown</h2>'+sh+'</div><div class="card"><h2 style="margin-bottom:8px">By question difficulty</h2>'+dh+'</div>'+
  '<div class="notice"><strong>Answer review is taking a little breather.</strong><br>You\'ll be able to review the correct answers and explanations once the organiser closes the challenge. Your score is available now.</div>'+
  '<div class="card"><h2>Your next move</h2><p>Fancy seeing where you stand? Check out the Brain League. You can also have another go whenever you like. Your best score is what counts.</p><div class="result-actions"><button class="btn" id="league">🏆 View the Brain League</button><button class="btn ghost" id="retake">Take it again</button><button class="btn ghost" id="copy">Copy my summary</button><button class="btn ghost" id="print">Print / save PDF</button></div><p class="legend" id="sendMsg" role="status">'+submitStatus+'</p></div>'+
  '<div class="card"><h2>Answer review</h2><p class="muted" id="reviewState">Checking whether the challenge has closed…</p><div id="reviewContent" class="review-hidden"></div></div>'+
  '<p class="legend">This is an informal reasoning challenge, not an IQ test or validated psychometric assessment. Results describe performance on these questions only.</p></div>';
  sendSubmission(payload,function(ok,msg){var el=document.getElementById("sendMsg");if(el)el.textContent=ok?"Result recorded successfully.":msg});
  document.getElementById("league").onclick=openLeaderboard;
  document.getElementById("retake").onclick=function(){usedSec=undefined;ans=null;intro();window.scrollTo(0,0)};
  document.getElementById("print").onclick=function(){window.print()};
  document.getElementById("copy").onclick=function(){var t="Brain League - "+who+"\nScore: "+tot+"/"+Q.length+" ("+pct+"%)\n"+SECS.map(function(s){return s+": "+by[s][0]+"/"+by[s][1]}).join("\n")+"\nTime: "+fmt(usedSec);try{navigator.clipboard.writeText(t).then(function(){document.getElementById("sendMsg").textContent="Summary copied."})}catch(e){}};
  jsonp({action:"status",playerId:PLAYER.id},function(state){
    challengeClosed=!!(state&&state.closed);
    var st=document.getElementById("reviewState"),box=document.getElementById("reviewContent");
    if(!st||!box)return;
    if(challengeClosed){st.textContent="The challenge is closed. Your answer review is now available on this device.";box.className="";box.innerHTML=buildReview();}
    else{st.textContent="Answer explanations will unlock when the organiser closes the challenge."}
  });
  function buildReview(){
    var rv="";
    Q.forEach(function(q,i){var ok=ans[i]===q[3];rv+='<div class="rv"><p class="legend">Question '+(i+1)+' · '+q[0]+'</p><p>'+esc(q[1])+'</p>'+(q[5]?figH(q[5]):'')+(q[2][0].charAt(0)==="~"?optsH(q):'')+'<p>'+(ok?'<span class="ok">Correct</span>':'<span class="bad">'+(ans[i]<0?'Not answered':'Incorrect')+'</span>')+' · Your answer: '+(ans[i]<0?'none':T(q,ans[i]))+' · Correct answer: '+T(q,q[3])+'</p><p class="legend">'+esc(q[4])+'</p></div>'}
    );return rv;
  }
}
intro();
})();
</script>
