function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}function reminder(){return reminders[Math.floor(Math.random()*reminders.length)]}function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function loadPlayer(){try{var p=JSON.parse(localStorage.getItem(PLAYER_KEY)||"null");if(p&&p.id)return p}catch(e){}var p={id:"PLR-"+crypto.randomUUID(),nickname:""};save(PLAYER_KEY,p);return p}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function jsonp(params){return new Promise(function(resolve,reject){var cb="blCb"+Date.now()+Math.random().toString(36).slice(2),s=document.createElement("script"),done=false;function clean(){try{delete window[cb]}catch(e){}s.remove()}window[cb]=function(v){done=true;clean();resolve(v)};s.onerror=function(){if(!done){clean();reject(new Error("Could not reach the results service. Check your connection and try again."))}};params.callback=cb;s.src=API_URL+"?"+Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");document.body.appendChild(s)})}
function api(action,data){return jsonp(Object.assign({action:action},data||{}))}
function applyTheme(theme){document.documentElement.dataset.theme=theme;save("brainLeagueTheme",theme);var b=document.getElementById("themeToggle");if(b)b.textContent=theme==="dark"?"☀ Light theme":"◐ Dark theme"}function themeButton(){var t=localStorage.getItem("brainLeagueTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");applyTheme(t)}
function shell(content){app.innerHTML='<div class="row" style="margin-bottom:16px"><div class="eyebrow">The Brain League</div><button type="button" class="btn ghost theme" id="themeToggle">Theme</button></div>'+content;var b=document.getElementById("themeToggle");if(b)b.onclick=function(){applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")}}
function vis(sp){var it=sp.split("+"),n=it.length,w=60/n,o="";it.forEach(function(p,i){var a=p.split(","),k=a[0],r=Math.min([10,16,22][+a[3]],w/2-2),x=w*i+w/2,y=30,h=r*.8,d,at='fill="'+(a[1]==="o"?"none":"currentColor")+'"'+(a[1]==="g"?' fill-opacity=".3"':"")+' stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" transform="rotate('+a[2]+' '+x+' 30)'+(a[4]==="1"?' translate('+2*x+' 0) scale(-1 1)':'')+'"';if(k==="c")d='<circle cx="'+x+'" cy="30" r="'+r+'" '+at+'/>';else if(k==="s")d='<rect x="'+(x-r)+'" y="'+(30-r)+'" width="'+2*r+'" height="'+2*r+'" '+at+'/>';else{var P=k==="t"?[[x,y-r],[x+r,y+h],[x-r,y+h]]:k==="d"?[[x,y-r],[x+r,y],[x,y+r],[x-r,y]]:k==="l"?[[x-.6*r,y-r],[x-.1*r,y-r],[x-.1*r,y+.5*r],[x+.7*r,y+.5*r],[x+.7*r,y+r],[x-.6*r,y+r]]:[[x,y-r],[x+.7*r,y],[x+.25*r,y],[x+.25*r,y+r],[x-.25*r,y+r],[x-.25*r,y],[x-.7*r,y]];d='<polygon points="'+P.map(function(z){return z.join(",")}).join(" ")+'" '+at+'/>'}o+=d});return '<svg viewBox="0 0 60 60" aria-hidden="true">'+o+'</svg>'}
function figH(f){if(!f)return "";return '<div class="fig '+(f.length===9?'m':'')+'">'+f.map(function(s){return s==="?"?'<div class="fc q">?</div>':'<div class="fc">'+vis(s)+'</div>'}).join("")+'</div>'}
function id(){return crypto.randomUUID()}
function intro(message){clearInterval(timer);timer=null;themeButton();var closed=false;api("status",{playerId:PLAYER.id}).then(function(r){closed=!!r.closed;renderIntro(message,closed)}).catch(function(){renderIntro(message,false)})}
function renderIntro(message,closed){shell('<section class="intro-hero"><div class="eyebrow">A little brain workout · '+Q.length+' questions · 55 minutes</div><h1>Ready to give your brain a good workout?</h1><p class="intro-copy">Welcome to the office brain games. A bit of logic, a splash of numbers, a few visual puzzles and a healthy dose of “wait… let me think”. No pressure, just you, your brain and '+Q.length+' chances to surprise yourself.</p><div class="intro-tags"><span>🧠 Think sharp</span><span>⚡ Trust your instincts</span><span>🎯 Have a go</span></div></section><div class="card stack"><h2>How to play</h2><p>Questions across numerical reasoning, logical deduction, pattern recognition and spatial reasoning. You have <strong>55 minutes</strong>. Every correct answer earns a point; wrong answers do not lose marks. You can move around and revisit questions.</p><div class="name-wrap"><label for="nickname">What should we call you? <span class="muted">(required)</span></label><input id="nickname" type="text" maxlength="32" autocomplete="nickname" placeholder="Your name or nickname" aria-describedby="nameError"><div class="err" id="nameError" role="alert">'+esc(message||"")+'</div><button class="btn" id="start" type="button" '+(closed?'disabled':'')+' style="margin-top:10px">'+(closed?'Challenge closed':'Start the challenge →')+'</button></div><p class="legend">Your nickname and completed attempts are recorded for the Brain League. This is an informal reasoning challenge, not a validated assessment.</p></div><div class="daily"><strong>Daily reminder</strong><br>'+esc(reminder())+'</div><div class="row"><button class="btn ghost" id="showLeague">🏆 View the Brain League</button><span class="pill">Leaderboard entry is part of the challenge</span></div>');
var input=document.getElementById("nickname");input.value=PLAYER.nickname||"";document.getElementById("showLeague").onclick=leaderboard;var start=document.getElementById("start");if(closed){document.getElementById("nameError").textContent="The organiser has closed this challenge. New attempts are unavailable.";return}start.disabled=!input.value.trim();input.oninput=function(){start.disabled=!input.value.trim()};input.onkeydown=function(e){if(e.key==="Enter")begin()};start.onclick=begin;
function begin(){var nick=input.value.trim().replace(/[<>]/g,"").replace(/s+/g," ");if(nick.length<2||nick.length>32){document.getElementById("nameError").textContent="Enter a nickname between 2 and 32 characters.";input.focus();return}PLAYER.nickname=nick;save(PLAYER_KEY,PLAYER);var attemptId=id();api("start",{playerId:PLAYER.id,nickname:nick,attemptId:attemptId}).then(function(r){if(!r.ok)throw new Error(r.error||"Could not start the challenge.");state={playerId:PLAYER.id,nickname:nick,attemptId:attemptId,startedAt:r.startedAt,answers:Array(Q.length).fill(null),flags:Array(Q.length).fill(false),current:0,started:true};save(PROGRESS_KEY,state);renderTest()}).catch(function(e){document.getElementById("nameError").textContent=e.message})}}
function restore(){try{var s=JSON.parse(localStorage.getItem(PROGRESS_KEY)||"null");if(s&&s.started&&s.answers&&s.answers.length===Q.length){state=s;PLAYER.nickname=s.nickname;return true}}catch(e){}return false}
function renderTest(){clearInterval(timer);if(!state)return intro();if(Date.now()-Date.parse(state.startedAt)>=LIMIT*1000){finish();return}var q=Q[state.current],done=state.answers.filter(function(a){return a!==null}).length,pct=Math.round(done/Q.length*100),vo=typeof q.options[0]==="string"&&q.options[0].charAt(0)==="~";var choices=q.options.map(function(v,i){return {value:v,key:i}});if(!state.order||state.order.length!==Q.length||!state.order[state.current]){choices=shuffle(choices);if(!state.order)state.order=Array(Q.length);state.order[state.current]=choices.map(function(x){return x.value});save(PROGRESS_KEY,state)}else choices=state.order[state.current].map(function(v){return {value:v,key:q.options.indexOf(v)}});
var buttons=choices.map(function(c,i){var selected=state.answers[state.current]===c.value;return '<button type="button" data-choice="'+esc(c.value)+'" aria-pressed="'+selected+'" aria-label="Option '+L[i]+'"><b>'+L[i]+'</b>'+(vo?vis(c.value.slice(1)):'<span>'+esc(c.value)+'</span>')+'</button>'}).join("");
shell('<div class="testbar"><div class="row"><strong>Question '+(state.current+1)+' of '+Q.length+' · '+done+' answered</strong><span class="timer" id="clock"></span></div><div class="slim-track" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" aria-label="Answered questions"><i style="width:'+pct+'%"></i></div></div><div class="card question-card"><div class="row"><div class="sec">'+esc(q.category)+'</div><button class="btn ghost" type="button" id="flag">'+(state.flags[state.current]?'⚑ Flagged':'⚐ Flag for review')+'</button></div><div class="qt">'+esc(q.prompt)+'</div>'+figH(q.figure)+'<div class="opts '+(vo?'v':'')+'" role="group" aria-label="Answer options">'+buttons+'</div></div><div class="row"><button class="btn ghost" type="button" id="prev" '+(state.current===0?'disabled':'')+'>← Previous</button><button class="btn ghost" type="button" id="jump">☷ Jump to question</button><button class="btn" type="button" id="next">'+(state.current===Q.length-1?'Finish':'Next question →')+'</button></div><div class="row"><span class="legend">'+done+' of '+Q.length+' answered</span><button class="btn ghost" type="button" id="finish">Finish test</button></div><div id="testError" class="err" role="alert"></div>');
app.querySelectorAll(".opts button").forEach(function(b){b.onclick=function(){state.answers[state.current]=b.dataset.choice;save(PROGRESS_KEY,state);renderTest()}});document.getElementById("flag").onclick=function(){state.flags[state.current]=!state.flags[state.current];save(PROGRESS_KEY,state);renderTest()};document.getElementById("prev").onclick=function(){state.current--;persistRender()};document.getElementById("next").onclick=function(){if(state.current===Q.length-1)finish();else{state.current++;persistRender()}};document.getElementById("finish").onclick=finish;document.getElementById("jump").onclick=openDrawer;drawNav();tick();timer=setInterval(tick,500)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function persistRender(){save(PROGRESS_KEY,state);renderTest()}
function drawNav(){var grid=document.getElementById("navgrid");if(!grid)return;grid.innerHTML=Q.map(function(_,i){return '<button type="button" class="'+(i===state.current?'current ':'')+(state.answers[i]!==null?'answered ':'')+(state.flags[i]?'flagged':'')+'" aria-label="Question '+(i+1)+(state.answers[i]!==null?', answered':'')+(state.flags[i]?', flagged':'')+'" data-q="'+i+'">'+(i+1)+'</button>'}).join("");grid.querySelectorAll("button").forEach(function(b){b.onclick=function(){state.current=+b.dataset.q;save(PROGRESS_KEY,state);document.getElementById("drawer").close();renderTest()}});document.getElementById("closeDrawer").onclick=function(){document.getElementById("drawer").close()};document.getElementById("jump").onclick=openDrawer}
function openDrawer(){var d=document.getElementById("drawer");drawNav();if(d.showModal)d.showModal();else d.setAttribute("open","")}
function tick(){var el=document.getElementById("clock");if(!el||!state)return;var elapsed=Math.max(0,Math.floor((Date.now()-Date.parse(state.startedAt))/1000)),left=Math.max(0,LIMIT-elapsed);el.textContent=fmt(left);if(left<=0)finish()}
function finish(){if(!state||state.submitting)return;clearInterval(timer);timer=null;state.submitting=true;state.submissionId=state.submissionId||id();state.finishedAtClient=new Date().toISOString();save(PROGRESS_KEY,state);pending={submissionId:state.submissionId,attemptId:state.attemptId,playerId:state.playerId,nickname:state.nickname,answers:state.answers};save("brainLeaguePending_v2",pending);renderSending(false);submitPending()}
function renderSending(failed,msg){themeButton();shell('<div class="eyebrow">Challenge complete</div><h1>Thanks for taking part, '+esc(state.nickname)+'!</h1><div class="card stack"><h2 id="resultTitle">'+(attemptResult?'Your result':'Checking your result…')+'</h2><div id="resultDetails">'+(attemptResult?resultMarkup(attemptResult):'<p class="muted">Your answers are being checked securely.</p>')+'</div><div class="notice" id="submitMessage" role="status">'+esc(msg||(failed?'Your result is saved on this device and needs to be retried.':'Sending your result securely…'))+'</div><button class="btn" id="retry" type="button" '+(failed?'':'hidden')+'>Retry submission</button><div class="actions"><button class="btn ghost" id="league">🏆 View the Brain League</button><button class="btn ghost" id="review" type="button">Check answer review</button><button class="btn ghost" id="retake" type="button" '+(attemptResult?'':'disabled')+'>Take it again</button></div></div><div class="daily"><strong>Daily reminder</strong><br>'+esc(reminder())+'</div><div class="card"><h2>Answer review</h2><div id="reviewContent" class="muted">Answer explanations unlock when the organiser closes the challenge.</div></div>');document.getElementById("retry").onclick=submitPending;document.getElementById("league").onclick=leaderboard;document.getElementById("retake").onclick=function(){state=null;pending=null;attemptResult=null;localStorage.removeItem(PROGRESS_KEY);localStorage.removeItem("brainLeaguePending_v2");intro()};document.getElementById("review").onclick=loadReview; if(attemptResult)loadReview()}
function resultMarkup(r){var cats=r.categories||{},diff=r.difficulty||{},h='<div class="big">'+r.score+' <span class="muted" style="font-size:1.3rem">/ '+Q.length+'</span></div><p>'+r.percentage+'% correct · Time used '+fmt(r.seconds)+' of '+fmt(LIMIT)+'.</p>';CATEGORIES.forEach(function(c){var x=cats[c]||[0,0];h+='<div class="sr"><div class="row"><strong>'+esc(c)+'</strong><span>'+x[0]+' / '+x[1]+'</span></div><div class="bar"><i style="width:'+(x[1]?100*x[0]/x[1]:0)+'%"></i></div></div>'});h+='<h2 style="margin-top:16px">By question difficulty</h2>';['Easier','Medium','Harder'].forEach(function(c){var x=diff[c]||[0,0];h+='<div class="sr"><div class="row"><strong>'+c+'</strong><span>'+x[0]+' / '+x[1]+'</span></div><div class="bar"><i style="width:'+(x[1]?100*x[0]/x[1]:0)+'%"></i></div></div>'});return h}
function submitPending(){if(!pending)return;document.getElementById("submitMessage").textContent="Submitting your saved result…";document.getElementById("retry").hidden=true;var delay=900,tries=0;function attempt(){fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:"submit"},pending))}).catch(function(){}).finally(function(){poll()})}function poll(){api("status",{submissionId:pending.submissionId,playerId:pending.playerId}).then(function(r){if(r.saved&&r.result){attemptResult=r.result;pending=null;localStorage.removeItem("brainLeaguePending_v2");localStorage.removeItem(PROGRESS_KEY);renderSending(false,"Your result has been recorded.")}else if(++tries<6){setTimeout(attempt,delay);delay=Math.min(delay*2,12000)}else{renderSending(true,"We couldn’t confirm the save yet. Your pending result is stored here; retry when you’re back online.")}}).catch(function(){if(++tries<6){setTimeout(attempt,delay);delay=Math.min(delay*2,12000)}else renderSending(true,"We couldn’t confirm the save yet. Your pending result is stored here; retry when you’re back online.")})}attempt()}
function loadReview(){api("review",{submissionId:pending?pending.submissionId:(state&&state.submissionId)||""}).then(function(r){var box=document.getElementById("reviewContent");if(!box)return;if(!r.closed){box.textContent="Answer explanations unlock when the organiser closes the challenge.";return}if(!r.ok)throw new Error(r.error||"Review is unavailable.");box.innerHTML=r.questions.map(function(x,i){var chosen=state&&state.answers[i],ok=chosen===x.answer;return '<div class="rv"><p class="legend">Question '+(i+1)+' · '+esc(Q[i].category)+'</p><p>'+esc(Q[i].prompt)+'</p>'+figH(Q[i].figure)+'<p><strong class="'+(ok?'':'muted')+'">'+(ok?'Correct':chosen===null?'Not answered':'Review')+'</strong> · Your answer: '+(chosen===null?'none':esc(cleanChoice(i,chosen)))+' · Correct answer: '+esc(cleanChoice(i,x.answer))+'</p><p class="legend">'+esc(x.explanation)+'</p></div>'}).join("")} ).catch(function(e){var box=document.getElementById("reviewContent");if(box)box.textContent=e.message})}
function cleanChoice(i,v){if(String(v).charAt(0)==="~"){var order=state&&state.order&&state.order[i]||Q[i].options;var ix=order.indexOf(v);return ix<0?'Visual option':'Option '+L[ix]}return v}
function leaderboard(){shell('<div class="row"><div><div class="eyebrow">The Brain League</div><h1>Hall of Fame 🏆</h1></div><button class="btn ghost" id="back">← Back</button></div><div class="card"><h2>Current standings</h2><p id="leagueState" class="muted" role="status">Loading the leaderboard…</p><div id="rows" aria-live="polite"></div><p class="legend">Each player’s first completed attempt determines their rank. Retakes are allowed and shown in the attempt count. Ties are broken by completion time.</p></div>');document.getElementById("back").onclick=function(){restore()?renderSending(false):intro()};api("leaderboard",{playerId:PLAYER.id}).then(function(d){if(!d.ok)throw new Error(d.error||"Could not load the leaderboard.");var rows=d.rows||[],host=document.getElementById("rows"),st=document.getElementById("leagueState");st.textContent=rows.length?"Rankings loaded.":"No completed attempts yet. Be the first to make the board!";host.innerHTML=rows.map(function(r,i){return '<div class="rank-card '+(r.isYou?'you':'')+'"><div class="rank-no">'+(i<3?["🥇","🥈","🥉"][i]:i+1)+'</div><div><div class="rank-name">'+esc(r.nickname)+(r.isYou?' · You':'')+'</div><div class="rank-meta">'+r.attempts+' attempt'+(r.attempts===1?'':'s')+' · '+esc(r.date||'')+'</div></div><div class="rank-score">'+r.score+'/'+Q.length+'<div class="rank-meta">'+r.percentage+'%</div></div></div>'}).join("")}).catch(function(e){document.getElementById("leagueState").textContent=e.message})}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&state&&!state.submitting){tick();save(PROGRESS_KEY,state)}});themeButton();if(restore()) {state.order=state.order||[];if(state.submitting){pending=JSON.parse(localStorage.getItem("brainLeaguePending_v2")||"null");renderSending(true,"Your saved result is waiting to be sent.")}else renderTest()}else intro();
})();
</script></body></html>
